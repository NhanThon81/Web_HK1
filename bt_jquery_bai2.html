<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>jQuery - Bookstore Online</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 760px;
        margin: 30px auto;
        padding: 0 15px;
      }
      .book {
        border: 1px solid #ccc;
        border-radius: 6px;
        padding: 10px;
        margin: 8px 0;
      }
      .price {
        color: #c0392b;
        font-weight: bold;
        margin: 4px 0;
      }
      .featured {
        background: #fff3cd;
        border-color: #f1c40f;
      }
      .selected {
        background: #d6eaf8;
      }
      .added {
        background: #27ae60;
        color: #fff;
      }
      .error {
        color: red;
      }
      button {
        padding: 6px 12px;
        cursor: pointer;
        margin: 4px 2px;
      }
      input,
      select {
        padding: 6px;
        margin: 4px 0;
      }
      #box {
        width: 100px;
        height: 100px;
        background: #3498db;
      }
    </style>
  </head>
  <body>
    <div id="book-list">
      <div class="book">
        <h3>Đắc Nhân Tâm</h3>
        <p class="price">120.000đ</p>
      </div>
      <div class="book">
        <h3>Tư Duy Nhanh và Chậm</h3>
        <p class="price">150.000đ</p>
      </div>
      <div class="book">
        <h3>Nhà Giả Kim</h3>
        <p class="price">89.000đ</p>
      </div>
    </div>

    <script>
      $(function () {
        $("#book-list").css("background", "#f4f4f4"); // theo ID
        $(".book").css("border-color", "orange"); // theo class
        $("h3").css("color", "green"); // theo thẻ
        console.log("Số cuốn sách:", $(".book").length); // đếm phần tử
      });
    </script>
  </body>
</html>
